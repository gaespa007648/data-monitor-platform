name: ${COMPOSE_PROJECT_NAME:-data-monitor-platform}

x-backend: &backend
  image: data-monitor-platform-backend:0.1.0
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    DB_HOST: db
    DB_PORT: 3306
    DB_NAME: ${DB_NAME:?Copy .env.example to .env first}
    DB_USER: ${DB_USER:?Set DB_USER}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
    DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:-}
    TZ: UTC
  networks:
    - data_net
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: mariadb:11.7.2
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME}
      MARIADB_USER: ${DB_USER:?Set DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-flush-log-at-trx-commit=1"]
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *backend
    command: ["python", "-m", "app.initialize"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - app_net
      - data_net
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      TZ: UTC
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    networks:
      - app_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  app_net:
  data_net:
    internal: true

volumes:
  mariadb_data:
