<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; font-family: sans-serif; }
    body { margin: 0; color: var(--text-color, #31333f); background: var(--background-color, #fff); }
    .viewport { overflow-x: auto; border: 1px solid #d8dce3; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #e5e8ec; padding: 9px 12px; text-align: left; white-space: nowrap; }
    th { background: var(--secondary-background-color, #f4f6fa); position: sticky; top: 0; }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: var(--secondary-background-color, #f4f6fa); }
    .sort-button { border: 0; background: transparent; color: inherit; font: inherit; font-weight: 600;
                   cursor: pointer; padding: 0; white-space: nowrap; }
    .sort-button:hover, .sort-button:focus-visible { color: var(--primary-color, #f63366); }
    .arrow { margin-left: 5px; opacity: .7; }
    .actions { width: 52px; text-align: center; }
    .delete-button { visibility: hidden; border: 1px solid #e88; border-radius: 5px;
                     background: #fff; color: #b4232c; padding: 4px 7px; cursor: pointer; }
    tr:hover .delete-button, tr:focus-within .delete-button { visibility: visible; }
    .delete-button:hover { background: #fff0f0; }
    .empty { padding: 14px; color: #667085; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const root = document.getElementById("root");
    let lastHeight = 0;
    function send(type, data) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...data}, "*");
    }
    function resize() {
      const height = document.body.scrollHeight + 4;
      if (height !== lastHeight) {
        lastHeight = height;
        send("streamlit:setFrameHeight", {height});
      }
    }
    function emit(action) {
      send("streamlit:setComponentValue", {
        dataType: "json",
        value: {...action, event_id: crypto.randomUUID()}
      });
    }
    function render(args, theme) {
      if (theme) {
        document.documentElement.style.setProperty("--text-color", theme.textColor);
        document.documentElement.style.setProperty("--background-color", theme.backgroundColor);
        document.documentElement.style.setProperty("--secondary-background-color", theme.secondaryBackgroundColor);
        document.documentElement.style.setProperty("--primary-color", theme.primaryColor);
      }
      root.replaceChildren();
      const viewport = document.createElement("div");
      viewport.className = "viewport";
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const header = document.createElement("tr");
      for (const column of args.columns || []) {
        const th = document.createElement("th");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "sort-button";
        button.textContent = column;
        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = args.sort_by === column ? (args.sort_dir === "asc" ? "↑" : "↓") : "↕";
        button.appendChild(arrow);
        button.setAttribute("aria-label", "依 " + column + " 排序");
        button.onclick = () => emit({action: "sort", dataset_id: args.dataset_id, column});
        th.appendChild(button);
        header.appendChild(th);
      }
      const actionHeader = document.createElement("th");
      actionHeader.className = "actions";
      actionHeader.textContent = "操作";
      header.appendChild(actionHeader);
      thead.appendChild(header);
      table.appendChild(thead);
      const tbody = document.createElement("tbody");
      for (const row of args.rows || []) {
        const tr = document.createElement("tr");
        for (const column of args.columns || []) {
          const td = document.createElement("td");
          const value = row.data[column];
          td.textContent = value === null || value === undefined ? "" : String(value);
          tr.appendChild(td);
        }
        const td = document.createElement("td");
        td.className = "actions";
        if (row.can_delete) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "delete-button";
          button.textContent = "刪除";
          button.setAttribute("aria-label", "刪除資料列 " + row.record_id);
          button.onclick = () => emit({action: "delete", dataset_id: args.dataset_id,
                                      record_id: row.record_id});
          td.appendChild(button);
        }
        tr.appendChild(td);
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      viewport.appendChild(table);
      root.appendChild(viewport);
      if (!(args.rows || []).length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "目前沒有資料";
        root.appendChild(empty);
      }
      resize();
    }
    window.addEventListener("message", event => {
      if (event.source !== window.parent || event.data?.type !== "streamlit:render") return;
      render(event.data.args || {}, event.data.theme);
    });
    new ResizeObserver(resize).observe(document.body);
    send("streamlit:componentReady", {apiVersion: 1});
  </script>
</body>
</html>
